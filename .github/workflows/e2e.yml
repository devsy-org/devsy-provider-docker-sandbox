name: Native VM qualification
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      core_ref:
        required: true
        type: string
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_COMMIT: ${{ inputs.ref }}
      CORE_REF: ${{ inputs.core_ref }}
      VERSION: ${{ inputs.version }}
      NATIVE_EVIDENCE: ${{ vars.SBX_NATIVE_EVIDENCE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .workflow
          persist-credentials: false
      - uses: ./.workflow/.github/actions/verify-native-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualified-native-evidence
          path: ${{ runner.temp }}/native-evidence.json
          if-no-files-found: error
