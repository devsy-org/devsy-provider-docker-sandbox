name: Release assets
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-assets
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      core_ref: ${{ steps.core.outputs.ref }}
      core_tag: ${{ steps.core.outputs.tag }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft | type == "boolean"' | grep -qx true
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$sha" = "$EXPECTED_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: core
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag }}
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
          CORE_REF: ${{ vars.SBX_DISTRIBUTION_CORE_REF }}
        run: |
          CORE_TAG="$(jq -er .minimum_devsy_version internal/compat/profile.json)"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CORE_REF" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          jq -e --arg version "${VERSION#v}" '.["."] == $version' .release-please-manifest.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$RELEASE_SHA" --jq '.verification.verified')" = true
          [[ "$CORE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]
          test "$CORE_TAG" = "$(jq -r .minimum_devsy_version internal/compat/profile.json)"
          test "$(gh api "repos/devsy-org/devsy/releases/tags/$CORE_TAG" --jq '.draft == false')" = true
          core_object="$(gh api "repos/devsy-org/devsy/git/ref/tags/$CORE_TAG" --jq .object.sha)"
          core_type="$(gh api "repos/devsy-org/devsy/git/ref/tags/$CORE_TAG" --jq .object.type)"
          if [[ "$core_type" == tag ]]; then
            core_object="$(gh api "repos/devsy-org/devsy/git/tags/$core_object" --jq .object.sha)"
          fi
          test "$core_object" = "$CORE_REF"
          test "$(gh api "repos/devsy-org/devsy/git/commits/$CORE_REF" --jq '.verification.verified')" = true
          echo "ref=$CORE_REF" >> "$GITHUB_OUTPUT"
          echo "tag=$CORE_TAG" >> "$GITHUB_OUTPUT"
  distribution:
    needs: resolve
    uses: ./.github/workflows/distribution.yml
    with:
      version: ${{ inputs.tag }}
      core_ref: ${{ needs.resolve.outputs.core_ref }}
      ref: ${{ needs.resolve.outputs.sha }}
  qualification:
    needs: resolve
    uses: ./.github/workflows/e2e.yml
    with:
      version: ${{ inputs.tag }}
      core_ref: ${{ needs.resolve.outputs.core_ref }}
      ref: ${{ needs.resolve.outputs.sha }}
  publish:
    needs: [resolve, distribution, qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: provider-release
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: qualified-native-evidence
          path: dist
      - name: Verify released manifest and profile
        run: |
          test -s dist/provider.yaml
          test -s dist/checksums.txt
          test -s dist/compatibility-profile.json
          cmp internal/compat/profile.json dist/compatibility-profile.json
          (cd dist && sha256sum --check checksums.txt)
      - name: Produce version-specific release notes
        env:
          VERSION: ${{ inputs.tag }}
          CORE_REF: ${{ needs.resolve.outputs.core_ref }}
          CORE_TAG: ${{ needs.resolve.outputs.core_tag }}
          EVIDENCE_FILE: dist/native-evidence.json
        run: |
          test -s "$EVIDENCE_FILE"
          {
            printf 'Docker Sandboxes provider %s\n\n' "$VERSION"
            printf 'Required Devsy core release: %s (%s)\n\n' "$CORE_TAG" "$CORE_REF"
            printf 'Natively qualified hosts. The maintainer qualified each one locally on a real VM, not in CI. Each line gives the SHA-256 of the captured native test log:\n'
            jq -r '.hosts[] | "- \(.host): sbx client \(.client_version), daemon \(.daemon_version), qualified locally by the maintainer, log sha256 \(.local_run.log_sha256)"' "$EVIDENCE_FILE"
            printf '\nBuilt and unit-tested only, with no native qualification evidence. These hosts run with a warning:\n'
            jq -r '["linux/amd64", "linux/arm64", "darwin/arm64", "windows/amd64"] - .qualified_hosts | .[] | "- " + .' internal/compat/profile.json
            printf '\nThe manifest includes all four hosts. Install sbx and sign in separately. Deleting a default workspace machine removes all guest data, including named volumes.\n'
          } > dist/RELEASE_NOTES.txt
      - name: Publish complete release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          CORE_TAG: ${{ needs.resolve.outputs.core_tag }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION" --jq .sha)" = "$RELEASE_SHA"
          draft="$(gh release view "$VERSION" --json isDraft --jq .isDraft)"
          if [[ "$draft" == false ]]; then
            remote="$(mktemp -d)"
            trap 'rm -rf "$remote"' EXIT
            gh release download "$VERSION" --dir "$remote" --pattern '*'
            for file in dist/*; do cmp "$file" "$remote/$(basename "$file")"; done
            cp "$remote/provider.yaml" "$remote/provider.yaml.published"
            cp "$remote/checksums.txt" "$remote/checksums.txt.published"
            cp "$remote/compatibility-profile.json" "$remote/compatibility-profile.json.published"
            (cd "$remote" && sha256sum --check checksums.txt)
            go run ./cmd/package-provider "$VERSION" "$remote" internal/compat/profile.json
            cmp "$remote/provider.yaml.published" "$remote/provider.yaml"
            cmp "$remote/checksums.txt.published" "$remote/checksums.txt"
            cmp "$remote/compatibility-profile.json.published" "$remote/compatibility-profile.json"
            exit 0
          fi
          [[ "$draft" == true ]]
          gh release upload "$VERSION" dist/* --clobber
          response="$(mktemp)"
          trap 'rm -f "$response" "$response.err"' EXIT
          latest=true
          if gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$response" 2> "$response.err"; then
            latest_tag="$(jq -er '.tag_name' "$response")"
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest_tag...$RELEASE_SHA" --jq .status)"
            case "$status" in
              ahead|identical) ;;
              behind) latest=false ;;
              *) exit 1 ;;
            esac
          else
            cat "$response.err" >&2
            grep -q 'HTTP 404' "$response.err"
          fi
          flags=()
          if [[ "$CORE_TAG" == *-* ]]; then
            flags+=(--prerelease)
            latest=false
          fi
          gh release edit "$VERSION" --draft=false --latest="$latest" --notes-file dist/RELEASE_NOTES.txt "${flags[@]}"
