name: Native provider package
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      core_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        host:
          - {os: linux, arch: amd64, runner: ubuntu-latest, suffix: ''}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm, suffix: ''}
          - {os: darwin, arch: arm64, runner: macos-latest, suffix: ''}
          - {os: windows, arch: amd64, runner: windows-latest, suffix: '.exe'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Test, compile and execute on target platform
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET_OS: ${{ matrix.host.os }}
          TARGET_ARCH: ${{ matrix.host.arch }}
          SUFFIX: ${{ matrix.host.suffix }}
        run: |
          test "$(go env GOOS)" = "$TARGET_OS"
          test "$(go env GOARCH)" = "$TARGET_ARCH"
          go test ./...
          mkdir -p dist
          name="devsy-provider-docker-sandbox-$TARGET_OS-$TARGET_ARCH$SUFFIX"
          go build -trimpath -ldflags "-X main.version=$VERSION" -o "dist/$name" ./cmd/devsy-provider-docker-sandbox
          test "$("./dist/$name" version)" = "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: executable-${{ matrix.host.os }}-${{ matrix.host.arch }}
          path: dist/*
          if-no-files-found: error
  manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: provider
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: provider/go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: executable-*
          path: dist
          merge-multiple: true
      - name: Generate and verify release bytes
        working-directory: provider
        env:
          VERSION: ${{ inputs.version }}
        run: |
          go run ./cmd/package-provider "$VERSION" ../dist internal/compat/profile.json
          cd ../dist
          sha256sum --check checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-release
          path: dist/*
          if-no-files-found: error
  install:
    needs: manifest
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        host:
          - {os: linux, arch: amd64, runner: ubuntu-latest, suffix: ''}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm, suffix: ''}
          - {os: darwin, arch: arm64, runner: macos-latest, suffix: ''}
          - {os: windows, arch: amd64, runner: windows-latest, suffix: '.exe'}
    steps:
      - name: Require pinned compatible Devsy core commit
        shell: bash
        env:
          CORE_REF: ${{ inputs.core_ref }}
        run: |
          [[ "$CORE_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: provider
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: devsy-org/devsy
          ref: ${{ inputs.core_ref }}
          path: devsy
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: devsy/go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: provider-release
          path: dist
      - name: Verify native Devsy parser, alias, downloader and rejection
        working-directory: devsy
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          go build -o "$RUNNER_TEMP/devsy${{ matrix.host.suffix }}" .
          go run ../provider/integration/provider_install.go "$RUNNER_TEMP/devsy${{ matrix.host.suffix }}" "$GITHUB_WORKSPACE/dist" "$VERSION"
